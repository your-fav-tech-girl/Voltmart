<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <body class="bg-gray-100 text-gray-900">
      <main class="min-h-screen flex items-center justify-center px-6 py-16">
        <aside
          class="w-full max-w-xl bg-white rounded-2xl shadow-md p-8 border border-gray-200"
        >
          <a
            href="/"
            class="mt-8 inline-flex w-30 justify-center py-3 rounded-lg border border-gray-300 hover:bg-gray-50 transition text-sm font-medium"
          >
            ← Back to Shop
          </a>
          <h2 class="text-xl font-semibold text-center mb-6">Order Summary</h2>

          <!-- Customer info (optional) -->
          <div
            class="mb-6 rounded-xl border border-gray-200 p-4 text-sm space-y-1"
          >
            <p>
              <span class="text-gray-500">Name:</span>
              <span id="summary-name"></span>
            </p>
            <p>
              <span class="text-gray-500">Email:</span>
              <span id="summary-email"></span>
            </p>
            <p>
              <span class="text-gray-500">Phone:</span>
              <span id="summary-phone"></span>
            </p>
            <p>
              <span class="text-gray-500">Address:</span>
              <span id="summary-address"></span>
            </p>
          </div>

          <div id="summary-items" class="space-y-4"></div>

          <div class="mt-8 border-t border-gray-200 pt-5 space-y-3 text-sm">
            <div class="flex justify-between">
              <span class="text-gray-600">Subtotal</span>
              <span id="summary-subtotal" class="font-medium">$0.00</span>
            </div>
            <div class="flex justify-between">
              <span class="text-gray-600">Shipping</span>
              <span id="summary-shipping" class="font-medium">$0.00</span>
            </div>
            <div class="flex justify-between text-base border-t pt-4 mt-4">
              <span class="font-semibold">Total</span>
              <span id="summary-total" class="font-semibold">$0.00</span>
            </div>
          </div>
          <div class="mt-8">
            <a
              href="/summary.html"
              id="place-order-btn"
              class="block w-full text-center py-4 rounded-xl bg-yellow-600 text-white font-semibold tracking-wide hover:bg-yellow-700 active:scale-95 transition shadow-lg cursor-pointer"
            >
              Place Order
            </a>
          </div>

          <p
            id="checkout-status"
            class="text-center text-sm text-gray-500 mt-3"
          ></p>
        </aside>
      </main>

      <script type="module" src="/src/summary.ts"></script>
    </body>
  </body>
</html>
